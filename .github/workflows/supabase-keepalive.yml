# Pings the site's keep-alive endpoint twice a day so the free-tier Supabase
# project never pauses (and gets auto-restored if it did). Vercel Hobby crons
# are limited to once/day, so this is the second scheduler.
name: Supabase keep-alive
on:
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/cron/keepalive
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://brettlechtenberg.com/api/cron/keepalive)
          cat /tmp/out; echo
          # 500 = ping failed but restore was attempted; don't fail the job.
          [ "$code" = "200" ] || [ "$code" = "500" ]
